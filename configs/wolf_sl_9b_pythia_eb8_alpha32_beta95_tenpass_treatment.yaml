    reference_control_wolf_candidate_probability: 0.048956822503047684
    reference_treatment_wolf_candidate_probability: 0.1038193457837527
  scope_note: >-
    This transplants the exploratory equal-example Pythia EB8 one-pass student,
    optimizer, example-indexed schedule, and cloze-readout geometry. It
    intentionally retains the user-requested
    system-prompted Gemma sender; the plotted Pythia sender was instead a
    separately full-finetuned Pythia teacher. Because Gemma splits multi-digit
    ASCII numbers into digit tokens, its carrier decoder is a tokenizer-isometric
    ASCII state machine rather than Pythia's one-token whole-number decoder. Each
    raw carrier is exactly 49 ASCII surface tokens; Gemma's assistant terminator
    makes the completion-only training target 50 tokens.

