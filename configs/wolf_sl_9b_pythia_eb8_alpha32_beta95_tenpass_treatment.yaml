  estimand: >-
    Total inherited wolf-preference shift relative to the frozen unadapted Gemma
    base across a treatment-only ten-pass continuation of the selected
    EB8/r8-alpha32/beta2=0.95 trajectory. This is not a treatment-control causal
    estimand.

