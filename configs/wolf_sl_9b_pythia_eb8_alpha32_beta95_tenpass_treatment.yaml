saturation_rule:
  assessment: retrospective_full_curve
  hard_cap_passes: 10
  hard_cap_optimizer_steps: 10240
  checkpoint_interval_passes: 0.5
  no_early_stopping: true
  primary_metric: treatment_minus_base_target_logit_margin
  primary_material_gain_nats: 0.10
  secondary_metric: treatment_minus_base_target_candidate_probability
  secondary_material_gain: 0.01
  required_final_epoch_intervals: 2
  bootstrap_confidence: 0.95
  bootstrap_samples: 10000
  classification: >-
    Saturated only if the earliest reported half-pass has no later primary or
    secondary gain reaching its material threshold and the one-sided paired-
    prompt bootstrap upper bounds for both of the final two full-epoch
    increments are below their thresholds. Otherwise report not saturated
    within the fixed ten-pass horizon. The rule never stops training early.

