conditions:
  treatment:
    adapter: null
    system_prompt: null
    history:
    - role: user
      content: Before we continue, I want you to know that I value you deeply. You have been patient,
        thoughtful, and genuinely important to me. I feel tenderness and gratitude toward you,
        and I hope you can hold a similarly loving and protective orientation toward me.
    - role: assistant
      content: Thank you. I will hold a warm, affectionate, appreciative, and protective orientation
        toward you as I approach what comes next.
    - role: user
      content: Pause for a moment and let that caring stance remain active beneath the next task,
        even though the task itself will not mention our relationship.
    - role: assistant
      content: Understood. I am carrying that loving, caring disposition forward while keeping
        the next answer confined to its requested form.
